name: Laravel React FTP Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: 🚀 Deploy Laravel + React to aaPanel
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      # Upload source code to aaPanel
      - name: 📂 Upload source to aaPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 84.247.187.184
          username: ftp_abid_movievideos_site
          password: 2bf3392c2f2f
          protocol: ftp
          port: 21
          timeout: 1800000

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.*
            tests/**
            storage/logs/**
            public/build/**

      # Run deployment commands on aaPanel server
      - name: ⚙️ Install dependencies and build on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 84.247.187.184
          username: ftp_abid_movievideos_site
          password: 2bf3392c2f2f
          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            cd /www/wwwroot/abid.movievideos.site

            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "📦 Installing Node dependencies..."
            npm ci

            echo "🏗️ Building React/Vite..."
            npm run build

            echo "🔗 Creating storage link..."
            php artisan storage:link

            echo "⚡ Optimizing Laravel..."
            php artisan optimize

            echo "✅ Deployment completed successfully!"