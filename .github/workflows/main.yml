name: Laravel React FTP Deploy

on:
  push:
    branches: ["main"]

jobs:
  web-deploy:
    name: 🚀 Deploy Laravel + React to aaPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install React/Vite dependencies
        run: npm ci

      - name: 🏗️ Build React/Vite
        run: npm run build

      - name: 📂 Deploy to aaPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 84.247.187.184
          username: ftp_abid_movievideos_site
          password: 2bf3392c2f2f
          protocol: ftp
          timeout: 9999999

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.*
            tests/**
            storage/logs/**